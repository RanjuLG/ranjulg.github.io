<section class="about-section section-sm" aria-labelledby="about-heading">
  <div class="container">
    <header class="section-heading">
      <p class="section-kicker">Professional Profile</p>
      <h2 id="about-heading" class="section-title">About</h2>
    </header>

    <article class="about-summary card">
      <p>{{ summary }}</p>
    </article>

    <div class="strength-grid">
      @for (item of strengths; track item.title) {
      <article class="strength-card card">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </article>
      }
    </div>
  </div>
</section>
