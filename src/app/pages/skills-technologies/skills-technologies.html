<section class="skills-section section-sm" aria-labelledby="skills-heading">
  <div class="container">
    <header class="section-heading">
      <p class="section-kicker">Core Capabilities</p>
      <h2 id="skills-heading" class="section-title">Skills & Technologies</h2>
    </header>

    <div class="skills-grid">
      @for (group of skills; track group.category) {
      <article class="skill-group card">
        <h3 class="skill-category">{{ group.category }}</h3>
        <div class="skill-tags">
          @for (item of group.items; track item) {
          <span class="skill-tag">{{ item }}</span>
          }
        </div>
      </article>
      }
    </div>
  </div>
</section>
