<!-- Footer (Ryder Cragie Signature Minimalist) -->
<footer class="footer">
  <div class="container footer-container">
    <hr class="hairline-divider" />

    <div class="back-to-top-wrap">
      <button type="button" class="back-to-top-link" (click)="scrollToTop()">
        ▲ Back to top ▲
      </button>
    </div>

    <hr class="hairline-divider" />

    <div class="footer-bottom">
      <div class="footer-social-icons">
        @for (link of socialLinks; track link.name) {
        <a
          [href]="link.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="link.name"
          class="footer-icon-link"
          [title]="link.name"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="footer-icon">
            <path [attr.d]="link.icon" fill="currentColor" />
          </svg>
        </a>
        }
      </div>

      <p class="copyright">
        &copy; {{ currentYear }} {{ config.personal.name }}. All rights reserved.
      </p>
    </div>
  </div>
</footer>
