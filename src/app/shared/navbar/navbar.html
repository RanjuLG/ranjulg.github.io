<!-- Top Navigation Bar (Ryder Cragie Style) -->
<nav class="top-navbar">
  <div class="navbar-container container">
    <!-- Brand: Headshot + Name -->
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <img [src]="photoUrl" [alt]="config.personal.name" class="brand-avatar" width="34" height="34" />
      <span class="brand-name">{{ config.personal.name }}</span>
    </a>

    <!-- Navigation Links -->
    <ul class="nav-links">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">🏠</span>
          <span>Home</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/about"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">📃</span>
          <span>About</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/projects"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">💻</span>
          <span>Projects</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/blog"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">📝</span>
          <span>Articles</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">💬</span>
          <span>Contact</span>
        </a>
      </li>
    </ul>

    <!-- Actions (Theme Toggle & Mobile menu toggle) -->
    <div class="navbar-actions">
      <button
        class="theme-toggle-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.currentTheme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
        title="Toggle dark/light mode"
      >
        <!-- Sun Icon (Light Mode) -->
        <svg
          *ngIf="themeService.currentTheme() === 'light'"
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <!-- Moon Icon (Dark Mode) -->
        <svg
          *ngIf="themeService.currentTheme() === 'dark'"
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <!-- Mobile Menu Toggle -->
      <button
        class="mobile-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="hamburger" [class.active]="isMenuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Drawer -->
  <div class="mobile-menu" [class.open]="isMenuOpen()">
    <ul class="mobile-nav-links">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">🏠</span> Home
        </a>
      </li>
      <li>
        <a
          routerLink="/about"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">📃</span> About
        </a>
      </li>
      <li>
        <a
          routerLink="/projects"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">💻</span> Projects
        </a>
      </li>
      <li>
        <a
          routerLink="/blog"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">📝</span> Articles
        </a>
      </li>
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          <span class="nav-emoji">💬</span> Contact
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- Overlay for mobile -->
<div class="navbar-overlay" [class.active]="isMenuOpen()" (click)="closeMenu()"></div>
